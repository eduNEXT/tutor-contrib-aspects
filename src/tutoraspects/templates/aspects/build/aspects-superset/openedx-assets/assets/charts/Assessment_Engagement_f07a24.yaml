description: |-
  If an assessment assesses multiple competencies, this table shows one row per competency.

  **How it is computed**

  - Mastery Rule is the criterion's current effective rule (its own override, else its rule profile's).
  - Attempted: enrolled learners that core judged on the criterion, or that have a grade on the assessment. Not Attempted: the other enrolled learners.
  - The bars behind the learner counts are each count's share of the enrolled learners.
  - Avg. Best Attempt Grade averages the attempted learners' best grades. The fill is the average and the dark tick is the rule: below the rule the fill turns red, the number bold, and "· below rule" follows it.

  **Limitations**

  - The Type column (quiz, exam, ...) is `<missing data>`: the subsection's assignment type is not in Aspects' course blocks.
  - No links on Course or Mastery Rule: clicking a value cross-filters, as elsewhere in Aspects.
