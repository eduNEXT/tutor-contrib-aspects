description: |-
  Learners by mastery status.

  **Limitations**

  - Counted per course: a learner who demonstrated a competency in one course and not in another counts once in each of those statuses, so a bar can add up to more learners than the competency has.
  - A learner with a status for a competency but no enrollment in a course that assesses it counts with their overall competency status, which is never Not Demonstrated.
