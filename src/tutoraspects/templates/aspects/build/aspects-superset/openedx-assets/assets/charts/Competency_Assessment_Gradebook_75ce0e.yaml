description: |-
  Best attempt score for each competency-aligned assessment. Available when the dashboard is filtered to a single course or competency.

  **How it is computed**

  - One column per assessment, split by the competencies it assesses, each with the criterion's mastery rule.
  - The score is the learner's best subsection grade, from the xAPI subsection grade statements.
  - Met / Below rule is openedx-core's judgement (the criterion status sink). Core judged the grade the learner had at grading time and only raises a status, so a later lower grade keeps Met.
  - Not judged: the learner has a grade but core has no status, e.g. a grade from before the criterion existed. No score: no grade and no status.

  **Limitations**

  - Learners are rows by name: two learners with the same name share a row.
  - Pathway selection is not available yet.
