description: |-
  Best attempt score for each competency-aligned assessment. Available when the dashboard is filtered to a single course or competency.

  **How it is computed**

  - One column per assessment x competency, labelled with the criterion's mastery rule. Best is the learner's best subsection grade; vs Rule is Best minus the rule threshold, green when it meets the rule and red when it doesn't.
  - An empty cell means no score: the learner has no grade on the assessment.

  **Limitations**

  - The mockup's "✓ Met / ✗ Below rule" labels can't render in a pivot table; vs Rule and its colour stand in for them. They compare the best grade with the rule, while core's status (Met / Below rule in Assessment Engagement and the Assessment Snapshot) judged the grade the learner had at grading time. The two agree unless a grade was lowered after core judged it, or a status was set by hand.
  - Pathway selection is not available yet.
