schema: '{{ DBT_PROFILE_TARGET_DATABASE }}'
sql: |
  {% raw -%}
  {%- set orgs = filter_values('org') -%}
  {%- set courses = filter_values('course_name') -%}
  {%- set competencies = filter_values('competency') -%}
  {%- set statuses = filter_values('status') -%}
  {%- if courses | length == 1 or competencies | length == 1 %}
  {%- endraw %}
  select
      org,
      course_key,
      course_name,
      competency,
      status,
      name,
      username,
      email,
      actor_id,
      gradebook_column,
      criterion_status,
      best_grade,
      rule_value,
      concat(
          '<span style="font-weight:400">',
          encodeXMLComponent(if(empty(ifNull(name, '')), username, name)),
          '</span>'
      ) as Learner,
      encodeXMLComponent(assessment) as Assessment,
      concat(
          '<span style="display:inline-block;padding:0 7px;line-height:18px;border:1px solid #CBD2DB;border-radius:4px;background:#F3F5F8;font-weight:400;white-space:nowrap">',
          encodeXMLComponent(competency),
          '</span><br><span style="display:inline-block;margin-top:4px;color:#1F6FA8;text-decoration:underline;font-weight:400;white-space:nowrap">Rule: ',
          rule_label,
          '</span>'
      ) as Criterion
  from (
    {% filter indent(width=4) %}{% include 'openedx-assets/queries/competency_assessment_grades.sql' %}{% endfilter %}
  )
  {% raw -%}
  {%- else %}
  select
      {% if orgs %}arrayJoin(array{{ orgs | where_in }}){% else %}''{% endif %} as org,
      '' as course_key,
      {% if courses %}arrayJoin(array{{ courses | where_in }}){% else %}''{% endif %} as course_name,
      {% if competencies %}arrayJoin(array{{ competencies | where_in }}){% else %}''{% endif %} as competency,
      {% if statuses %}arrayJoin(array{{ statuses | where_in }}){% else %}''{% endif %} as status,
      'Select one course or one competency to see the gradebook' as name,
      '' as username,
      '' as email,
      '' as actor_id,
      '' as gradebook_column,
      'Notice' as criterion_status,
      cast(null, 'Nullable(Float64)') as best_grade,
      cast(null, 'Nullable(Float64)') as rule_value,
      concat(
          '<span style="color:#1F6FA8;font-weight:700">&#9432;</span> ',
          '<span style="font-weight:400">Select one course or one competency in the dashboard filters to see the gradebook.</span>'
      ) as Learner,
      '' as Assessment,
      '' as Criterion
  {%- endif %}
  {%- endraw %}
table_name: competency_gradebook
