default_endpoint: null
description: 'competency_assessment_grades for the gradebook, only when exactly one course or one competency is selected'
extra: {}
fetch_values_predicate: null
filter_select_enabled: true
folders: null
main_dttm_col: null
metrics:
- currency: null
  d3format: null
  description: 'Best grade and core''s judgement of it: Met, Below rule, Not judged (a grade but no status), or No score. HTML, so the pivot must render HTML'
  expression: |-
    multiIf(
        any(criterion_status) = 'Notice',
        '',
        any(criterion_status) = 'Met',
        concat('<div style="text-align:left"><span style="display:inline-block;padding:2px 8px;border-radius:3px;white-space:nowrap;background:#E3F1E9;border-left:3px solid #2E7D4F;color:#1E5E3A">', if(isNull(max(best_grade)), '', concat('<b style="color:#1C2430">', toString(round(max(best_grade) * 100)), '%</b>&nbsp;&nbsp;')), '<b>&#10003; Met</b></span></div>'),
        any(criterion_status) = 'Below rule',
        concat('<div style="text-align:left"><span style="display:inline-block;padding:2px 8px;border-radius:3px;white-space:nowrap;background:#F8E1E4;border-left:3px solid #B42335;color:#8A1C2B">', if(isNull(max(best_grade)), '', concat('<b style="color:#1C2430">', toString(round(max(best_grade) * 100)), '%</b>&nbsp;&nbsp;')), '<b>&#10005; Below rule</b></span></div>'),
        isNull(max(best_grade)),
        concat('<div style="text-align:left"><span style="display:inline-block;padding:2px 8px;border-radius:3px;white-space:nowrap;background:#EEF0F2;border:1px solid #D5DAE1;color:#5B6676">', 'No score</span></div>'),
        concat('<div style="text-align:left"><span style="display:inline-block;padding:2px 8px;border-radius:3px;white-space:nowrap;background:#EEF0F2;border:1px solid #D5DAE1;color:#5B6676">', if(isNull(max(best_grade)), '', concat('<b style="color:#1C2430">', toString(round(max(best_grade) * 100)), '%</b>&nbsp;&nbsp;')), 'Not judged</span></div>')
    )
  extra: {}
  metric_name: grade_cell
  metric_type: null
  verbose_name: Best attempt
  warning_text: null
- currency: null
  d3format: '.0%'
  description: null
  expression: 'max(best_grade)'
  extra: {}
  metric_name: best
  metric_type: null
  verbose_name: Best
  warning_text: null
- currency: null
  d3format: '+.0%'
  description: 'Best grade minus the mastery rule threshold: green when the best grade meets the rule'
  expression: 'round(max(best_grade) - max(rule_value), 6)'
  extra: {}
  metric_name: vs_rule
  metric_type: null
  verbose_name: vs Rule
  warning_text: null
