description: |-
  If a learner attempted an assessment multiple times, this distribution plots their best grade.

  **How it is computed**

  - Assessments are the subsections with a competency criterion. Each learner x assessment counts once, even when the assessment assesses several competencies.
  - The grade is the subsection grade from the LMS's xAPI subsection grade statements: weighted earned over weighted possible, across all of the subsection's problems.
  - Buckets are 10 points wide: 70 means 70% to 79.9%, 100 means a perfect score.
  - The mockup's "Assessment: All" dropdown is not in the chart. Use the dashboard filters instead.
